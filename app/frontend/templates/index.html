<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAID</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="startNewChat()">+ New chat</button>
            <div class="history-list" id="history-list">
                <!-- Conversations will be loaded here -->
            </div>
            <div class="user-profile">
                <div class="user-avatar">{{ username[0].upper() }}</div>
                <div style="flex-grow: 1;">{{ username }}</div>
                <a href="/logout" class="logout-link" style="text-decoration: none; font-size: 12px; opacity: 0.8;">Log out</a>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <!-- Header with Logo -->
            <header class="app-header">
                <button class="sidebar-toggle" onclick="toggleSidebar()" id="sidebar-toggle-btn" title="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="CivicAID Logo" class="header-logo">
                <h1 class="header-title">CivicAID</h1>
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn" title="Toggle dark mode">
                    <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </header>
            <div class="chat-area" id="chat-area">
                <!-- Messages will be loaded here -->
                <div class="welcome-message" id="welcome-message">
                    <h1>CivicAID</h1>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea id="message-input" placeholder="Send a message..." rows="1"
                        oninput="autoResize(this)"></textarea>
                    <button id="voice-btn" onclick="toggleVoiceRecording()" title="Voice input">
                        <svg id="voice-icon" stroke="currentColor" fill="none" class="voice-icon" viewBox="0 0 24 24" height="1em"
                            width="1em" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button id="send-btn" onclick="sendMessage()">
                        <svg stroke="currentColor" fill="none" class="send-icon" viewBox="0 0 24 24" height="1em"
                            width="1em" xmlns="http://www.w3.org/2000/svg">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="disclaimer">CivicAID can make mistakes. Consider checking important legal information.</div>
            </div>
        </div>
    </div>
    <script>
        // Global variable for AI response logo path
        const AI_RESPONSE_LOGO = "{{ url_for('static', filename='images/response_logo.png') }}";
        // Global variable for username
        const USERNAME = "{{ username }}";
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
